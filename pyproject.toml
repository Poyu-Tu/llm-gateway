[project]
name = "llm-gateway"
version = "0.1.0"
description = "Enterprise LLM Gateway with cost governance"
readme = "README.md"
authors = [
    { name = "Terry" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
