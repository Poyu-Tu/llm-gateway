[[questions]]
id = "c07"
note = "很長而且複雜：測字數門檻該不該送去強模型"
expected = "strong"
text = """
我們是一間大約五十人的電商公司，目前所有服務都跑在機房裡的一台實體主機上，包括網站、訂單資料庫和後台管理系統。最近半年訂單量成長了三倍，促銷活動時網站常常變慢甚至連不上，而且這台主機已經用了六年，硬碟壞過一次，當時花了兩天才把資料救回來。老闆希望半年內把系統搬到雲端，但預算有限，團隊只有兩位工程師，一位熟悉資料庫，另一位主要負責前端。目前每天大約三千筆訂單，尖峰時一小時可以到五百筆，我們希望搬遷期間網站停機不要超過一個晚上。我們也擔心搬遷時訂單資料遺失，或是搬完之後每個月的雲端費用失控；另外客戶資料裡有姓名、電話和地址，不確定放到雲端之後要注意哪些規定。請針對我們的情況，建議搬遷的優先順序、要先準備的事情，以及控制雲端費用的做法。"""
