各位同仁好，下週三下午兩點原本預定在三樓大會議室舉行的第四季專案進度會議，因為當天會議室臨時被安排給外部訪客使用，所以需要改到五樓的小會議室舉行，時間不變。請各專案負責人在會議前一天下班前，把各自負責項目的進度更新到共用資料夾裡的進度表，內容包括目前完成的比例、遇到的困難，以及下一階段預計要完成的工作。會議當天請準時出席，如果有事不能參加，請事先告知部門助理，並指定一位代理人代為報告。另外，會後會有簡單的茶點，請有飲食限制的同仁回覆助理，方便我們準備。會議資料會在前一天下午寄出，請大家先看過，當天討論會更有效率；如果需要投影設備或視訊連線，也請提前告訴助理。謝謝大家的配合。

請把上面這段公告改寫成更正式、簡潔的版本。"""

