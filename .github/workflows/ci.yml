# CI：每次推送到 main、每個 PR，都自動跑全部測試，並掃描容器映像的弱點
# 所有 Action 都鎖在 commit SHA（標籤可以被改指向別的程式碼，SHA 不行），並過 3 天冷卻期
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 預設只給讀程式碼的權限；這份 CI 不需要寫入任何東西
permissions:
  contents: read

# 同一個分支有新的推送時，取消還在跑的舊執行，省時間也不會兩次結果打架
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全部的測試，包括連 DynamoDB Local 的 integration 測試
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 取出程式碼；不把 GitHub 的權杖留在 git 設定裡，後面的步驟拿不到
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 安裝 uv，版本和 Dockerfile 用的一樣
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"

      # 照 uv.lock 安裝；lock 檔和 pyproject.toml 對不上就直接失敗
      - name: Install dependencies from the lock file
        run: uv sync --locked

      # 和本機一樣，用 compose.yaml 起測試專用的資料庫（127.0.0.1:8002）
      - name: Start the test database
        run: docker compose up -d dynamodb-test

      # 等資料庫起來：有回應就好（回什麼狀態碼都可以），最多等 30 秒
      - name: Wait for the test database
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8002; then
              exit 0
            fi
            sleep 1
          done
          echo "DynamoDB Local did not start in 30 seconds"
          exit 1

      - name: Run all tests
        run: uv run pytest

  # 建出和正式環境一樣的映像，用 Trivy 掃弱點
  image-scan:
    name: Image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t llm-gateway:ci .

      # 有修補版可以升級的 HIGH、CRITICAL 弱點就讓 CI 失敗；還沒有修補版的先不算（只能等上游修）
      # trivy-action v0.36.0（2026-04 發佈，Dependabot PR #4）：內部的 actions/cache 換成 v5，消除 Node.js 20 警告
      # Trivy 本身明寫 v0.74.0（2026-08-14 發佈，已過冷卻期）；不寫的話會用 action 內建的 v0.70.0
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: llm-gateway:ci
          version: v0.74.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # 掃設定檔寫錯的地方（Terraform、Dockerfile）：不用建映像、不用連 AWS，只讀檔案
  config-scan:
    name: Config scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 整個 repo 都掃（scan-ref: .），HIGH、CRITICAL 就讓 CI 失敗
      # 刻意接受的項目寫在該行上方的 #trivy:ignore 註解，附理由與到期日，不另開 .trivyignore
      - name: Scan Terraform and Dockerfile settings with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.74.0
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
